<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт Управления — Flexy Way</title>
  <!-- Paho MQTT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(20, 26, 45, 0.88);
      --card-border: rgba(99, 102, 241, 0.35);
      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #070913 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      overflow-x: hidden;
      touch-action: none;
    }

    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 0.65rem 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-badge.connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Live Game HUD */
    .game-hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .hud-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 0.4rem 0.6rem;
      text-align: center;
    }

    .hud-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .hud-value {
      font-size: 1.15rem;
      font-weight: 900;
      color: #38bdf8;
      margin-top: 0.1rem;
    }

    /* Переключатель режимов */
    .mode-switch-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.3rem;
      margin-top: 0.3rem;
    }

    .mode-switch-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 0.5rem;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-switch-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .sensor-info-bar {
      font-size: 0.75rem;
      color: #38bdf8;
      text-align: center;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 0.4rem 0.6rem;
      width: 100%;
      max-width: 440px;
      margin-top: 0.25rem;
      font-weight: 600;
    }

    /* Сенсорный радар-тачпад */
    .touch-area-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin: 0.3rem 0;
      flex: 1;
      justify-content: center;
    }

    .radar-card {
      width: 100%;
      height: 220px;
      position: relative;
      border-radius: 24px;
      background: radial-gradient(circle at center, rgba(14, 165, 233, 0.18) 0%, rgba(15, 23, 42, 0.85) 75%);
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.2), inset 0 0 30px rgba(14, 165, 233, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
    }

    .radar-guideline-x {
      position: absolute;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
      pointer-events: none;
    }

    .radar-guideline-y {
      position: absolute;
      height: 70%;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.4), transparent);
      pointer-events: none;
    }

    .radar-center-ring {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.35);
      pointer-events: none;
    }

    .laser-reticle {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, rgba(56, 189, 248, 0.25) 70%);
      border: 2px solid #ffffff;
      box-shadow: 0 0 20px #38bdf8, 0 0 40px #0ea5e9;
      transform: translate(0px, 0px);
      pointer-events: none;
      transition: transform 0.04s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .laser-reticle::after {
      content: '👜';
      font-size: 1.2rem;
    }

    .touch-hint {
      position: absolute;
      bottom: 12px;
      font-size: 0.72rem;
      color: rgba(148, 163, 184, 0.75);
      pointer-events: none;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* Главная кнопка действия */
    .start-btn {
      width: 100%;
      max-width: 440px;
      padding: 1.05rem 1rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .start-btn.calibrating {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4);
    }

    .controls-panel {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: 0.25rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      margin-left: 0.8rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
    }

    .hint-footer {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.2rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>FLEXY CONTROLLER</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Поиск экрана...</span>
    </div>
  </header>

  <!-- Live HUD -->
  <div class="game-hud">
    <div class="hud-box">
      <div class="hud-label">Счет</div>
      <div class="hud-value" id="hudScore">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Время</div>
      <div class="hud-value" id="hudTime">20 сек</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Комната</div>
      <div class="hud-value" id="hudRoom" style="font-size: 0.95rem;">FLEXY</div>
    </div>
  </div>

  <!-- Переключатель режима управления -->
  <div class="mode-switch-container">
    <button class="mode-switch-btn active" id="modeSwipeBtn" onclick="setControlMode('swipe')">
      🕹 Тач / Свайп
    </button>
    <button class="mode-switch-btn" id="modeTiltBtn" onclick="setControlMode('tilt')">
      🎯 Наклон телефона
    </button>
  </div>

  <div class="sensor-info-bar" id="sensorInfo">
    🟢 Ведите пальцем влево-вправо для управления сумкой
  </div>

  <!-- Сенсорный радар-тачпад -->
  <div class="touch-area-wrapper">
    <div class="radar-card" id="radar">
      <div class="radar-guideline-x"></div>
      <div class="radar-guideline-y"></div>
      <div class="radar-center-ring"></div>
      <div class="laser-reticle" id="laserReticle"></div>
      <div class="touch-hint" id="radarHint">СВАЙП / ТАЧ ВЛЕВО-ВПРАВО</div>
    </div>
  </div>

  <!-- Главная кнопка старта / калибровки -->
  <button class="start-btn" id="startBtn" onclick="onMainActionClick()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="22" y1="12" x2="18" y2="12"></line>
      <line x1="6" y1="12" x2="2" y2="12"></line>
      <line x1="12" y1="6" x2="12" y2="2"></line>
      <line x1="12" y1="22" x2="12" y2="18"></line>
    </svg>
    <span id="btnLabel">🎯 СБРОС В ЦЕНТР / СТАРТ</span>
  </button>

  <!-- Настройки чувствительности -->
  <div class="controls-panel">
    <div class="control-row">
      <span>Чувствительность</span>
      <div class="slider-container">
        <input type="range" id="sensSlider" min="0.6" max="2.6" step="0.1" value="1.3" oninput="updateSensitivity(this.value)">
        <span id="sensValue" style="color: #38bdf8; min-width: 32px;">1.3x</span>
      </div>
    </div>
  </div>

  <div class="hint-footer">
    Ловите женские предметы в сумку.<br>
    Не ловите мусорные детали!
  </div>

  <script>
    // --- Room ID ---
    const urlParams = new URLSearchParams(window.location.search);
    const hashRoom = window.location.hash ? window.location.hash.replace('#room=', '').replace('#', '') : null;
    let roomId = (urlParams.get('room') || hashRoom || 'FLEXY').toUpperCase();

    document.getElementById('hudRoom').textContent = roomId;

    // --- DOM Elements ---
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const btnLabel = document.getElementById('btnLabel');
    const laserReticle = document.getElementById('laserReticle');
    const radar = document.getElementById('radar');
    const hudScore = document.getElementById('hudScore');
    const hudTime = document.getElementById('hudTime');
    const sensSlider = document.getElementById('sensSlider');
    const sensValue = document.getElementById('sensValue');
    const sensorInfo = document.getElementById('sensorInfo');
    const modeSwipeBtn = document.getElementById('modeSwipeBtn');
    const modeTiltBtn = document.getElementById('modeTiltBtn');
    const radarHint = document.getElementById('radarHint');

    // --- State ---
    let controlMode = 'swipe'; // 'swipe' | 'tilt'
    let sensitivity = 1.3;
    let currentNormX = 0;
    let baseGamma = null;
    let pahoClient = null;
    let isConnected = false;

    function vibratePhone(pattern = 35) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function setConnectedUI(connected) {
      isConnected = connected;
      if (connected) {
        statusBadge.classList.add('connected');
        statusText.textContent = 'Подключено ⚡';
      } else {
        statusBadge.classList.remove('connected');
        statusText.textContent = 'Поиск экрана...';
      }
    }

    // --- Mode Switcher ---
    function setControlMode(mode) {
      controlMode = mode;
      vibratePhone(30);

      if (mode === 'tilt') {
        modeTiltBtn.classList.add('active');
        modeSwipeBtn.classList.remove('active');
        radarHint.textContent = 'НАКЛОНЯЙТЕ ТЕЛЕФОН ВЛЕВО / ВПРАВО';
        sensorInfo.textContent = '🟢 Режим: Наклон телефона влево-вправо';
        requestSensorPermission();
      } else {
        modeSwipeBtn.classList.add('active');
        modeTiltBtn.classList.remove('active');
        radarHint.textContent = 'СВАЙП / ТАЧ ВЛЕВО-ВПРАВО';
        sensorInfo.textContent = '🟢 Режим: Ведите пальцем влево-вправо';
        updateVisualReticle(0);
        sendMotion(0);
      }
    }

    // --- Paho MQTT Client ---
    function initPahoMQTT() {
      try {
        if (typeof Paho === 'undefined' || !Paho.MQTT) return;
        if (pahoClient && pahoClient.isConnected()) {
          try { pahoClient.disconnect(); } catch (e) {}
        }

        const clientId = 'c_' + Math.random().toString(36).substring(2, 10);
        pahoClient = new Paho.MQTT.Client('broker.hivemq.com', 8884, '/mqtt', clientId);

        pahoClient.onConnectionLost = () => {
          setConnectedUI(false);
          setTimeout(initPahoMQTT, 2000);
        };

        pahoClient.onMessageArrived = (message) => {
          try {
            const data = JSON.parse(message.payloadString);
            if (data.type === 'state') {
              if (data.score !== undefined) hudScore.textContent = data.score;
              if (data.timeLeft !== undefined) hudTime.textContent = `${data.timeLeft} сек`;
              if (data.state === 'gameover') {
                btnLabel.textContent = '🔄 СЫГРАТЬ ЕЩЕ РАЗ';
              } else {
                btnLabel.textContent = '🎯 СБРОС В ЦЕНТР / СТАРТ';
              }
            } else if (data.type === 'haptic') {
              if (data.pattern === 'coin') vibratePhone([35, 30, 45]);
              else if (data.pattern === 'gameover') vibratePhone([120, 60, 160]);
            }
          } catch (e) {}
        };

        pahoClient.connect({
          useSSL: true,
          timeout: 4,
          onSuccess: () => {
            setConnectedUI(true);
            vibratePhone(40);
            pahoClient.subscribe(`flexy/events/${roomId}`);

            const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'controller_joined' }));
            msg.destinationName = `flexy/events/${roomId}`;
            pahoClient.send(msg);
          },
          onFailure: () => {
            setConnectedUI(false);
            setTimeout(initFallbackMQTT, 1500);
          }
        });
      } catch (e) {
        console.warn('Paho init failed:', e);
      }
    }

    function initFallbackMQTT() {
      try {
        const clientId = 'c_' + Math.random().toString(36).substring(2, 10);
        pahoClient = new Paho.MQTT.Client('broker.emqx.io', 8084, '/mqtt', clientId);
        pahoClient.connect({
          useSSL: true,
          timeout: 4,
          onSuccess: () => {
            setConnectedUI(true);
            pahoClient.subscribe(`flexy/events/${roomId}`);
            const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'controller_joined' }));
            msg.destinationName = `flexy/events/${roomId}`;
            pahoClient.send(msg);
          },
          onFailure: () => {
            setTimeout(initPahoMQTT, 2500);
          }
        });
      } catch (e) {}
    }

    // Send motion packet to PC screen (60 FPS throttle)
    let lastSendTime = 0;
    function sendMotion(normX) {
      const now = performance.now();
      if (now - lastSendTime < 16) return;
      lastSendTime = now;

      if (pahoClient && pahoClient.isConnected()) {
        const payload = JSON.stringify({
          type: 'motion',
          x: normX,
          y: 0
        });
        const msg = new Paho.MQTT.Message(payload);
        msg.destinationName = `flexy/motion/${roomId}`;
        pahoClient.send(msg);
      }
    }

    function updateVisualReticle(normX) {
      const radarWidth = radar.clientWidth || 300;
      const maxOffset = (radarWidth / 2) - 30;
      laserReticle.style.transform = `translateX(${normX * maxOffset}px)`;
    }

    // --- Touch / Swipe Handling ---
    function handleTouchInput(clientX) {
      const rect = radar.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const halfW = rect.width / 2;

      let dx = (clientX - centerX) / (halfW * 0.9);
      dx = Math.max(-1.0, Math.min(1.0, dx * sensitivity));
      currentNormX = dx;

      updateVisualReticle(currentNormX);
      sendMotion(currentNormX);
    }

    radar.addEventListener('pointerdown', (e) => {
      radar.setPointerCapture(e.pointerId);
      handleTouchInput(e.clientX);
    });

    radar.addEventListener('pointermove', (e) => {
      if (e.buttons > 0 || e.pointerType === 'touch') {
        handleTouchInput(e.clientX);
      }
    });

    // --- Device Tilt / Gyro Handling ---
    function handleOrientation(e) {
      if (controlMode !== 'tilt') return;
      let gamma = e.gamma; // Наклон влево/вправо [-90..90°]
      if (gamma === null || gamma === undefined) return;

      if (baseGamma === null) {
        baseGamma = gamma;
      }

      let deltaGamma = (gamma - baseGamma);
      const MAX_TILT = 28.0; // 28 градусов полный ход

      let normX = (deltaGamma / MAX_TILT) * sensitivity;
      normX = Math.max(-1.0, Math.min(1.0, normX));
      currentNormX = normX;

      updateVisualReticle(currentNormX);
      sendMotion(currentNormX);
    }

    async function requestSensorPermission() {
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch (err) {}
      }

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        } catch (e) {}
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    // --- Action Button Click ---
    async function onMainActionClick() {
      vibratePhone(40);
      baseGamma = null; // Сброс нуля для наклона

      await requestSensorPermission();

      startBtn.classList.add('calibrating');
      btnLabel.textContent = '⚡ СИГНАЛ ОТПРАВЛЕН!';
      setTimeout(() => {
        btnLabel.textContent = '🎯 СБРОС В ЦЕНТР / СТАРТ';
        startBtn.classList.remove('calibrating');
      }, 500);

      updateVisualReticle(0);
      sendMotion(0);

      if (pahoClient && pahoClient.isConnected()) {
        const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'restart' }));
        msg.destinationName = `flexy/events/${roomId}`;
        pahoClient.send(msg);
      }
    }

    function updateSensitivity(val) {
      sensitivity = parseFloat(val);
      sensValue.textContent = `${val}x`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPahoMQTT();
      requestSensorPermission();
    });

    // Touch anywhere on screen on iOS requests sensor permission seamlessly
    window.addEventListener('touchstart', () => {
      requestSensorPermission();
    }, { once: true });
  </script>
</body>
</html>
