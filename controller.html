<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт Управления — Flexy Way</title>
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(20, 26, 45, 0.88);
      --card-border: rgba(99, 102, 241, 0.35);
      --accent-cyan: #38bdf8;
      --accent-purple: #818cf8;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #070913 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      overflow-x: hidden;
      touch-action: none;
    }

    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 0.65rem 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-badge.connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Live Game HUD */
    .game-hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .hud-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 0.4rem 0.6rem;
      text-align: center;
    }

    .hud-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .hud-value {
      font-size: 1.15rem;
      font-weight: 900;
      color: #38bdf8;
      margin-top: 0.1rem;
    }

    /* Переключатель режимов */
    .mode-switch-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.3rem;
      margin-top: 0.3rem;
    }

    .mode-switch-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 0.5rem;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-switch-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .sensor-info-bar {
      font-size: 0.75rem;
      color: #38bdf8;
      text-align: center;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 0.4rem 0.6rem;
      width: 100%;
      max-width: 440px;
      margin-top: 0.25rem;
      font-weight: 600;
    }

    /* Сенсорный радар-тачпад */
    .touch-area-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin: 0.3rem 0;
      flex: 1;
      justify-content: center;
    }

    .radar-card {
      width: 100%;
      height: 220px;
      position: relative;
      border-radius: 24px;
      background: radial-gradient(circle at center, rgba(14, 165, 233, 0.18) 0%, rgba(15, 23, 42, 0.85) 75%);
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.2), inset 0 0 30px rgba(14, 165, 233, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
    }

    .radar-guideline-x {
      position: absolute;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
      pointer-events: none;
    }

    .radar-guideline-y {
      position: absolute;
      height: 70%;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.4), transparent);
      pointer-events: none;
    }

    .radar-center-ring {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.35);
      pointer-events: none;
    }

    .laser-reticle {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, rgba(56, 189, 248, 0.25) 70%);
      border: 2px solid #ffffff;
      box-shadow: 0 0 20px #38bdf8, 0 0 40px #0ea5e9;
      transform: translate(0px, 0px);
      pointer-events: none;
      transition: transform 0.04s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .laser-reticle::after {
      content: '👜';
      font-size: 1.2rem;
    }

    .touch-hint {
      position: absolute;
      bottom: 12px;
      font-size: 0.72rem;
      color: rgba(148, 163, 184, 0.75);
      pointer-events: none;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* Главная кнопка действия */
    .start-btn {
      width: 100%;
      max-width: 440px;
      padding: 1.05rem 1rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .start-btn.calibrating {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4);
    }

    .controls-panel {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: 0.25rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      margin-left: 0.8rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
    }

    .hint-footer {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.2rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>FLEXY CONTROLLER</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Поиск экрана...</span>
    </div>
  </header>

  <!-- Live HUD -->
  <div class="game-hud">
    <div class="hud-box">
      <div class="hud-label">Счет</div>
      <div class="hud-value" id="hudScore">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Время</div>
      <div class="hud-value" id="hudTime">20 сек</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Комната</div>
      <div class="hud-value" id="hudRoom" style="font-size: 0.95rem;">FLEXY</div>
    </div>
  </div>

  <!-- Переключатель режима управления -->
  <div class="mode-switch-container">
    <button class="mode-switch-btn" id="modeSwipeBtn" onclick="setControlMode('swipe')">
      🕹 Тач / Свайп
    </button>
    <button class="mode-switch-btn active" id="modeTiltBtn" onclick="setControlMode('tilt')">
      🎯 Наклон телефона
    </button>
  </div>

  <div class="sensor-info-bar" id="sensorInfo">
    🟡 Наклон включится автоматически. Тач / свайп работает всегда.
  </div>

  <!-- Сенсорный радар-тачпад -->
  <div class="touch-area-wrapper">
    <div class="radar-card" id="radar">
      <div class="radar-guideline-x"></div>
      <div class="radar-guideline-y"></div>
      <div class="radar-center-ring"></div>
      <div class="laser-reticle" id="laserReticle"></div>
      <div class="touch-hint" id="radarHint">НАКЛОНЯЙТЕ ИЛИ ВЕДИТЕ ПАЛЬЦЕМ</div>
    </div>
  </div>

  <!-- Главная кнопка старта / калибровки -->
  <button class="start-btn" id="startBtn" onclick="onMainActionClick()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="22" y1="12" x2="18" y2="12"></line>
      <line x1="6" y1="12" x2="2" y2="12"></line>
      <line x1="12" y1="6" x2="12" y2="2"></line>
      <line x1="12" y1="22" x2="12" y2="18"></line>
    </svg>
    <span id="btnLabel">🎯 СБРОС В ЦЕНТР / СТАРТ</span>
  </button>

  <!-- Настройки чувствительности -->
  <div class="controls-panel">
    <div class="control-row">
      <span>Чувствительность</span>
      <div class="slider-container">
        <input type="range" id="sensSlider" min="0.6" max="2.6" step="0.1" value="1.3" oninput="updateSensitivity(this.value)">
        <span id="sensValue" style="color: #38bdf8; min-width: 32px;">1.3x</span>
      </div>
    </div>
  </div>

  <div class="hint-footer">
    Ловите женские предметы в сумку.<br>
    Не ловите мусорные детали!
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const relayUrl = params.get('relay') || '';
    const pairToken = params.get('pair') || '';
    const requestedSessionId = params.get('session') || '';
    const forceHttpsRelay = params.get('transport') === 'https';

    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const btnLabel = document.getElementById('btnLabel');
    const laserReticle = document.getElementById('laserReticle');
    const radar = document.getElementById('radar');
    const hudScore = document.getElementById('hudScore');
    const hudTime = document.getElementById('hudTime');
    const hudRoom = document.getElementById('hudRoom');
    const sensValue = document.getElementById('sensValue');
    const sensorInfo = document.getElementById('sensorInfo');
    const modeSwipeBtn = document.getElementById('modeSwipeBtn');
    const modeTiltBtn = document.getElementById('modeTiltBtn');
    const radarHint = document.getElementById('radarHint');

    let controlMode = 'tilt';
    let sensitivity = 1.3;
    let currentNormX = 0;
    let baseTilt = null;
    let relaySocket = null;
    let reconnectTimer = null;
    let reconnectDelay = 800;
    let sequence = 0;
    let connected = false;
    let sessionEnded = false;
    let orientationAttached = false;
    let orientationSamples = 0;
    let orientationProbeTimer = null;
    let orientationEventType = '';
    let touchInputActive = false;
    let touchOverrideUntil = 0;
    let automaticTiltPreferred = true;
    let rtcPeer = null;
    let motionChannel = null;
    let pendingRtcCandidates = [];
    let transportMode = 'websocket';
    let relayHandshakeComplete = false;
    let connectionAttemptTimer = null;
    let httpConnectInFlight = false;
    let httpPollRunning = false;
    let httpSendInFlight = false;
    let httpOutbound = [];

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'stun:stun.l.google.com:19302' },
      ],
    };

    const resumeKey = requestedSessionId && relayUrl
      ? `flexy-resume:${relayUrl}:${requestedSessionId}`
      : '';

    function vibratePhone(pattern = 35) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (_) {}
      }
    }

    function setConnectionUI(isConnected, text) {
      connected = isConnected;
      statusBadge.classList.toggle('connected', isConnected);
      statusText.textContent = text || (isConnected ? 'Подключено ⚡' : 'Поиск экрана...');
    }

    function setControllerError(message) {
      setConnectionUI(false, 'Нет подключения');
      sensorInfo.textContent = `🔴 ${message}`;
    }

    function sendRelay(payload) {
      if (!connected) return false;
      if (transportMode === 'https') {
        queueHttpEvent(payload);
        return true;
      }
      if (!relaySocket || relaySocket.readyState !== WebSocket.OPEN) return false;
      relaySocket.send(JSON.stringify(payload));
      return true;
    }

    function closeDirectControl() {
      pendingRtcCandidates = [];
      if (motionChannel) {
        motionChannel.onopen = null;
        motionChannel.onclose = null;
        try { motionChannel.close(); } catch (_) {}
      }
      motionChannel = null;
      if (rtcPeer) {
        rtcPeer.ondatachannel = null;
        rtcPeer.onicecandidate = null;
        rtcPeer.onconnectionstatechange = null;
        try { rtcPeer.close(); } catch (_) {}
      }
      rtcPeer = null;
    }

    function attachMotionChannel(channel) {
      motionChannel = channel;
      motionChannel.onopen = () => {
        statusText.textContent = 'Прямая связь ⚡';
      };
      motionChannel.onclose = () => {
        if (connected) {
          statusText.textContent = transportMode === 'https' ? 'HTTPS-связь ⚡' : 'Подключено ⚡';
        }
      };
    }

    function createRtcPeer() {
      if (typeof RTCPeerConnection === 'undefined') return null;
      closeDirectControl();
      const peer = new RTCPeerConnection(rtcConfig);
      rtcPeer = peer;
      peer.ondatachannel = (event) => {
        if (event.channel && event.channel.label === 'motion') attachMotionChannel(event.channel);
      };
      peer.onicecandidate = (event) => {
        sendRelay({
          type: 'rtc_ice_candidate',
          candidate: event.candidate ? {
            candidate: event.candidate.candidate,
            sdpMid: event.candidate.sdpMid,
            sdpMLineIndex: event.candidate.sdpMLineIndex,
          } : null,
        });
      };
      peer.onconnectionstatechange = () => {
        if (peer !== rtcPeer) return;
        if (['failed', 'closed'].includes(peer.connectionState)) closeDirectControl();
      };
      return peer;
    }

    async function handleRtcOffer(data) {
      const sdp = String(data.sdp || '');
      if (!sdp || typeof RTCPeerConnection === 'undefined') return;
      try {
        const earlyCandidates = pendingRtcCandidates;
        const peer = createRtcPeer();
        if (!peer) return;
        pendingRtcCandidates = earlyCandidates;
        await peer.setRemoteDescription({ type: 'offer', sdp });
        const queued = pendingRtcCandidates;
        pendingRtcCandidates = [];
        for (const candidate of queued) await peer.addIceCandidate(candidate);
        const answer = await peer.createAnswer();
        await peer.setLocalDescription(answer);
        sendRelay({ type: 'rtc_answer', sdp: peer.localDescription.sdp });
      } catch (_) {
        closeDirectControl();
      }
    }

    async function handleRtcCandidate(candidate) {
      if (!rtcPeer || !rtcPeer.remoteDescription) {
        pendingRtcCandidates.push(candidate);
        return;
      }
      try { await rtcPeer.addIceCandidate(candidate); } catch (_) {}
    }

    function storedResume() {
      if (!resumeKey) return null;
      try { return JSON.parse(sessionStorage.getItem(resumeKey) || 'null'); } catch (_) { return null; }
    }

    function saveResume(data) {
      if (!resumeKey) return;
      sessionStorage.setItem(resumeKey, JSON.stringify({
        sessionId: data.sessionId,
        resumeToken: data.resumeToken,
      }));
    }

    function clearResume() {
      if (resumeKey) sessionStorage.removeItem(resumeKey);
    }

    function handleRelayData(data) {
      if (!data || typeof data !== 'object') return;
      if (data.type === 'controller_ready') {
        relayHandshakeComplete = true;
        clearTimeout(connectionAttemptTimer);
        reconnectDelay = 800;
        saveResume(data);
        hudRoom.textContent = String(data.displayId || 'FLEXY').slice(0, 10);
        const readyText = transportMode === 'https'
          ? (data.resumed ? 'HTTPS восстановлен ⚡' : 'HTTPS-связь ⚡')
          : (data.resumed ? 'Связь восстановлена ⚡' : 'Подключено ⚡');
        setConnectionUI(true, readyText);
        showControlStatus();
        vibratePhone(40);
        return;
      }
      if (data.type === 'game_state') {
        if (data.score !== undefined) hudScore.textContent = data.score;
        if (data.timeLeft !== undefined) hudTime.textContent = `${data.timeLeft} сек`;
        btnLabel.textContent = data.state === 'gameover'
          ? '🔄 СЫГРАТЬ ЕЩЕ РАЗ'
          : '🎯 СБРОС В ЦЕНТР / СТАРТ';
        return;
      }
      if (data.type === 'haptic') {
        if (data.pattern === 'coin') vibratePhone([35, 30, 45]);
        if (data.pattern === 'gameover') vibratePhone([120, 60, 160]);
        return;
      }
      if (data.type === 'rtc_offer') {
        void handleRtcOffer(data);
        return;
      }
      if (data.type === 'rtc_ice_candidate') {
        void handleRtcCandidate(data.candidate);
        return;
      }
      if (data.type === 'host_offline') {
        closeDirectControl();
        setControllerError('Игровой экран отключился.');
      }
      if (data.type === 'session_ended') {
        sessionEnded = true;
        closeDirectControl();
        clearResume();
        setControllerError('Раунд завершён. Следующему гостю нужен новый QR-код.');
      }
    }

    function httpRelayBase() {
      try {
        const url = new URL(relayUrl);
        url.protocol = url.protocol === 'wss:' ? 'https:' : 'http:';
        url.pathname = url.pathname.replace(/\/ws\/?$/, '');
        url.search = '';
        url.hash = '';
        return url.toString().replace(/\/$/, '');
      } catch (_) {
        return '';
      }
    }

    function httpAuthPayload() {
      const resume = storedResume();
      if (resume && resume.sessionId === requestedSessionId && resume.resumeToken) {
        return { sessionId: resume.sessionId, resumeToken: resume.resumeToken };
      }
      return { pairToken };
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function postHttpRelay(path, payload) {
      const base = httpRelayBase();
      if (!base) throw new Error('Invalid relay URL');
      return fetch(base + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        cache: 'no-store',
        body: JSON.stringify(payload),
      });
    }

    function queueHttpEvent(payload) {
      if (payload.type === 'motion') {
        httpOutbound = httpOutbound.filter((event) => event.type !== 'motion');
      }
      httpOutbound.push(payload);
      if (httpOutbound.length > 80) {
        const firstMotion = httpOutbound.findIndex((event) => event.type === 'motion');
        if (firstMotion >= 0) httpOutbound.splice(firstMotion, 1);
        else httpOutbound.shift();
      }
      void flushHttpEvents();
    }

    async function flushHttpEvents() {
      if (httpSendInFlight || transportMode !== 'https' || !connected || !httpOutbound.length) return;
      httpSendInFlight = true;
      const event = httpOutbound.shift();
      try {
        const auth = httpAuthPayload();
        const response = await postHttpRelay('/api/controller/event', {
          sessionId: auth.sessionId,
          resumeToken: auth.resumeToken,
          event,
        });
        if (response.status === 401) {
          clearResume();
          setControllerError('Сессия закончилась. Отсканируйте новый QR-код.');
        } else if (!response.ok && event.type !== 'motion') {
          httpOutbound.unshift(event);
        }
      } catch (_) {
        if (event.type !== 'motion') httpOutbound.unshift(event);
        await wait(350);
      } finally {
        httpSendInFlight = false;
        if (httpOutbound.length && connected) void flushHttpEvents();
      }
    }

    async function pollHttpRelay() {
      if (httpPollRunning) return;
      httpPollRunning = true;
      while (transportMode === 'https' && connected && !sessionEnded) {
        try {
          const response = await postHttpRelay('/api/controller/poll', httpAuthPayload());
          if (response.status === 401) {
            clearResume();
            setControllerError('Сессия закончилась. Отсканируйте новый QR-код.');
            break;
          }
          if (!response.ok) throw new Error('HTTP poll failed');
          const data = await response.json();
          const events = Array.isArray(data.events) ? data.events : [];
          for (const event of events) handleRelayData(event);
        } catch (_) {
          if (transportMode !== 'https' || !connected) break;
          statusText.textContent = 'HTTPS: восстановление...';
          await wait(650);
        }
      }
      httpPollRunning = false;
    }

    async function startHttpFallback() {
      if (httpConnectInFlight || (transportMode === 'https' && connected) || sessionEnded) return;
      httpConnectInFlight = true;
      transportMode = 'https';
      clearTimeout(connectionAttemptTimer);
      clearTimeout(reconnectTimer);
      if (relaySocket && relaySocket.readyState < WebSocket.CLOSING) {
        try { relaySocket.close(); } catch (_) {}
      }
      setConnectionUI(false, 'HTTPS-подключение...');

      let retry = false;
      try {
        const auth = httpAuthPayload();
        const response = await postHttpRelay('/api/controller/connect', {
          sessionId: auth.sessionId,
          resumeToken: auth.resumeToken,
          pairToken,
        });
        let data = {};
        try { data = await response.json(); } catch (_) {}
        if (!response.ok) {
          const messages = {
            invalid_pair: 'QR-код повреждён. Отсканируйте новый.',
            expired_pair: 'QR-код устарел. Отсканируйте новый.',
            host_offline: 'Игровой экран сейчас не в сети.',
            controller_busy: 'Сейчас уже играет другой гость.',
          };
          setControllerError(messages[data.code] || 'Relay отклонил подключение. Отсканируйте новый QR-код.');
          return;
        }
        handleRelayData(data);
        void pollHttpRelay();
        void flushHttpEvents();
      } catch (_) {
        statusText.textContent = 'HTTPS: повтор подключения...';
        retry = true;
      } finally {
        httpConnectInFlight = false;
        if (retry && !connected && !sessionEnded) {
          reconnectTimer = setTimeout(startHttpFallback, 1200);
        }
      }
    }

    function connectRelay() {
      clearTimeout(reconnectTimer);
      const relayIsSecure = /^wss:\/\//i.test(relayUrl);
      const relayIsLocal = /^ws:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i.test(relayUrl);
      if ((!relayIsSecure && !relayIsLocal) || !pairToken || !requestedSessionId) {
        setControllerError('QR-ссылка неполная. Отсканируйте новый QR-код на экране игры.');
        return;
      }

      if (forceHttpsRelay) {
        void startHttpFallback();
        return;
      }

      setConnectionUI(false, 'Соединение...');
      transportMode = 'websocket';
      relayHandshakeComplete = false;
      try {
        relaySocket = new WebSocket(relayUrl);
      } catch (_) {
        void startHttpFallback();
        return;
      }
      clearTimeout(connectionAttemptTimer);
      connectionAttemptTimer = setTimeout(() => {
        if (!relayHandshakeComplete) void startHttpFallback();
      }, 3500);
      relaySocket.addEventListener('open', () => {
        statusText.textContent = 'Авторизация...';
        const resume = storedResume();
        if (resume && resume.sessionId === requestedSessionId && resume.resumeToken) {
          relaySocket.send(JSON.stringify({
            type: 'controller_resume',
            sessionId: resume.sessionId,
            resumeToken: resume.resumeToken,
          }));
        } else {
          relaySocket.send(JSON.stringify({ type: 'controller_hello', pairToken }));
        }
      });
      relaySocket.addEventListener('message', (event) => {
        if (transportMode !== 'websocket') return;
        let data;
        try { data = JSON.parse(event.data); } catch (_) { return; }
        handleRelayData(data);
      });
      relaySocket.addEventListener('close', (event) => {
        if (transportMode === 'https') return;
        clearTimeout(connectionAttemptTimer);
        closeDirectControl();
        setConnectionUI(false, 'Связь потеряна');
        if (sessionEnded) return;
        const canResume = Boolean(storedResume());
        if (!relayHandshakeComplete && [4403, 4404, 4409].includes(event.code)) {
          clearResume();
          const messages = {
            4403: 'QR-код уже использован или устарел. Отсканируйте новый.',
            4404: 'Игровой экран сейчас не в сети.',
            4409: 'Сейчас уже играет другой гость.',
          };
          setControllerError(messages[event.code]);
          return;
        }
        const retryableClose = ![4000, 4004, 4403, 4404, 4409].includes(event.code);
        if (canResume || retryableClose) {
          statusText.textContent = 'Восстановление...';
          reconnectTimer = setTimeout(connectRelay, reconnectDelay);
          reconnectDelay = Math.min(reconnectDelay * 1.7, 5000);
        }
      });
      relaySocket.addEventListener('error', () => {
        if (!relayHandshakeComplete && transportMode === 'websocket') {
          statusText.textContent = 'WebSocket недоступен — переключаемся на HTTPS...';
          void startHttpFallback();
        }
      });
    }

    let lastSendTime = 0;
    function sendMotion(normX) {
      const now = performance.now();
      if (now - lastSendTime < 20) return;
      lastSendTime = now;
      const epochNow = typeof performance.timeOrigin === 'number'
        ? performance.timeOrigin + now
        : Date.now();
      const payload = {
        type: 'motion',
        x: Math.max(-1, Math.min(1, normX)),
        y: 0,
        sequence: ++sequence,
        clientTime: Math.trunc(epochNow),
      };
      // Send through both paths. The host applies the first sequence it sees and
      // ignores the duplicate. Some mobile Chromium/Yandex builds report an open
      // DataChannel but intermittently lose unreliable packets; WebSocket remains
      // a live fallback instead of becoming disabled after WebRTC connects.
      if (motionChannel && motionChannel.readyState === 'open' && motionChannel.bufferedAmount < 2048) {
        try { motionChannel.send(JSON.stringify(payload)); } catch (_) {}
      }
      if (transportMode === 'websocket' && relaySocket && relaySocket.bufferedAmount > 8192) return;
      sendRelay(payload);
    }

    function updateVisualReticle(normX) {
      const maxOffset = ((radar.clientWidth || 300) / 2) - 30;
      laserReticle.style.transform = `translateX(${normX * maxOffset}px)`;
    }

    function updateModeUi(mode) {
      const tilt = mode === 'tilt';
      modeTiltBtn.classList.toggle('active', tilt);
      modeSwipeBtn.classList.toggle('active', !tilt);
      radarHint.textContent = tilt
        ? 'НАКЛОНЯЙТЕ ИЛИ ВЕДИТЕ ПАЛЬЦЕМ'
        : 'СВАЙП / ТАЧ ВЛЕВО-ВПРАВО';
      showControlStatus();
    }

    function showControlStatus() {
      if (controlMode !== 'tilt') {
        sensorInfo.textContent = '🟢 Ведите пальцем влево-вправо';
        return;
      }
      if (orientationSamples > 0) {
        sensorInfo.textContent = '🟢 Наклон работает. Тач / свайп тоже доступен.';
        return;
      }
      if (typeof DeviceOrientationEvent !== 'undefined'
        && typeof DeviceOrientationEvent.requestPermission === 'function'
        && !orientationAttached) {
        sensorInfo.textContent = '🟡 Нажмите СТАРТ и разрешите датчики. Свайп уже работает.';
        return;
      }
      sensorInfo.textContent = '🟡 Подключаем наклон. Тач / свайп уже работает.';
    }

    function secureSensorContext() {
      if (window.isSecureContext === true) return true;
      return window.location.protocol === 'https:'
        || window.location.hostname === 'localhost'
        || window.location.hostname === '127.0.0.1';
    }

    function attachOrientationListeners() {
      if (orientationAttached) return;
      orientationAttached = true;
      window.addEventListener('deviceorientation', handleOrientation, true);
      // Some Android/Yandex builds expose only the absolute variant.
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    }

    function startOrientationProbe() {
      orientationSamples = 0;
      orientationEventType = '';
      clearTimeout(orientationProbeTimer);
      orientationProbeTimer = setTimeout(() => {
        if (controlMode === 'tilt' && orientationSamples === 0) {
          controlMode = 'swipe';
          updateModeUi('swipe');
          sensorInfo.textContent = '🟠 Датчик не отвечает. Управляйте пальцем — этот режим работает всегда.';
        }
      }, 2200);
    }

    async function enableTiltFromGesture() {
      if (!secureSensorContext()) {
        sensorInfo.textContent = '🟠 Наклон требует HTTPS. Управляйте пальцем.';
        return false;
      }
      if (typeof DeviceOrientationEvent === 'undefined') {
        sensorInfo.textContent = '🟠 Этот браузер не предоставляет датчик. Используйте тачпад.';
        return false;
      }
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const result = await DeviceOrientationEvent.requestPermission();
          if (result !== 'granted') {
            sensorInfo.textContent = '🟠 Доступ к наклону запрещён. Используйте тачпад.';
            return false;
          }
        }
      } catch (_) {
        sensorInfo.textContent = '🟠 Браузер не дал доступ к наклону. Используйте тачпад.';
        return false;
      }

      attachOrientationListeners();
      startOrientationProbe();
      return true;
    }

    async function setControlMode(mode) {
      vibratePhone(30);
      if (mode === 'tilt') {
        automaticTiltPreferred = true;
        controlMode = 'tilt';
        baseTilt = null;
        updateModeUi('tilt');
        if (!(await enableTiltFromGesture())) {
          controlMode = 'swipe';
          updateModeUi('swipe');
        }
      } else {
        automaticTiltPreferred = false;
        controlMode = 'swipe';
        updateModeUi('swipe');
        updateVisualReticle(0);
        sendMotion(0);
      }
    }

    function handleTouchInput(clientX) {
      const rect = radar.getBoundingClientRect();
      let value = (clientX - (rect.left + rect.width / 2)) / ((rect.width / 2) * 0.9);
      value = Math.max(-1, Math.min(1, value * sensitivity));
      touchOverrideUntil = performance.now() + 450;
      baseTilt = null;
      currentNormX = value;
      updateVisualReticle(value);
      sendMotion(value);
    }

    function finishTouchInput() {
      touchInputActive = false;
      touchOverrideUntil = performance.now() + 450;
      baseTilt = null;
    }

    if ('PointerEvent' in window) {
      radar.addEventListener('pointerdown', (event) => {
        touchInputActive = true;
        if (radar.setPointerCapture) {
          try { radar.setPointerCapture(event.pointerId); } catch (_) {}
        }
        handleTouchInput(event.clientX);
      });
      radar.addEventListener('pointermove', (event) => {
        if (touchInputActive || event.buttons > 0 || event.pointerType === 'touch') {
          handleTouchInput(event.clientX);
        }
      });
      radar.addEventListener('pointerup', finishTouchInput);
      radar.addEventListener('pointercancel', finishTouchInput);
    } else {
      // Touch Events keep control working on older Safari/WebViews without PointerEvent.
      radar.addEventListener('touchstart', (event) => {
        touchInputActive = true;
        if (event.touches && event.touches[0]) handleTouchInput(event.touches[0].clientX);
        event.preventDefault();
      }, { passive: false });
      radar.addEventListener('touchmove', (event) => {
        if (event.touches && event.touches[0]) handleTouchInput(event.touches[0].clientX);
        event.preventDefault();
      }, { passive: false });
      radar.addEventListener('touchend', finishTouchInput, false);
      radar.addEventListener('touchcancel', finishTouchInput, false);

      let mouseInputActive = false;
      radar.addEventListener('mousedown', (event) => {
        mouseInputActive = true;
        touchInputActive = true;
        handleTouchInput(event.clientX);
      });
      window.addEventListener('mousemove', (event) => {
        if (mouseInputActive) handleTouchInput(event.clientX);
      });
      window.addEventListener('mouseup', () => {
        if (!mouseInputActive) return;
        mouseInputActive = false;
        finishTouchInput();
      });
    }

    function orientationLateral(event) {
      let rawAngle = 0;
      if (screen.orientation && typeof screen.orientation.angle !== 'undefined') {
        rawAngle = screen.orientation.angle;
      } else if (typeof window.orientation !== 'undefined') {
        rawAngle = window.orientation;
      }
      const angle = Number(rawAngle);
      if (angle === 90) return event.beta == null ? null : -event.beta;
      if (angle === 270 || angle === -90) return event.beta == null ? null : event.beta;
      if (angle === 180) return event.gamma == null ? null : -event.gamma;
      return event.gamma;
    }

    function handleOrientation(event) {
      if (controlMode !== 'tilt') return;
      if (touchInputActive || performance.now() < touchOverrideUntil) return;
      if (!orientationEventType) orientationEventType = event.type;
      if (orientationEventType !== event.type) return;
      const lateral = orientationLateral(event);
      if (!Number.isFinite(lateral)) return;
      orientationSamples += 1;
      if (orientationSamples === 1) {
        clearTimeout(orientationProbeTimer);
        sensorInfo.textContent = '🟢 Датчик работает. Наклоняйте телефон влево-вправо.';
      }
      if (baseTilt === null) baseTilt = lateral;
      let delta = lateral - baseTilt;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      const value = Math.max(-1, Math.min(1, (delta / 28) * sensitivity));
      currentNormX = value;
      updateVisualReticle(value);
      sendMotion(value);
    }

    async function onMainActionClick() {
      vibratePhone(40);
      // Safari requires requestPermission() to be the first awaited operation
      // inside the user's tap. Asking for Wake Lock first loses that gesture.
      if (automaticTiltPreferred && typeof DeviceOrientationEvent !== 'undefined') {
        controlMode = 'tilt';
        updateModeUi('tilt');
        if (!(await enableTiltFromGesture())) {
          controlMode = 'swipe';
          updateModeUi('swipe');
        }
      }
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch (_) {}
      }
      baseTilt = null;
      updateVisualReticle(0);
      sendMotion(0);
      sendRelay({ type: 'action', action: 'restart' });
      startBtn.classList.add('calibrating');
      btnLabel.textContent = '⚡ СИГНАЛ ОТПРАВЛЕН!';
      setTimeout(() => {
        btnLabel.textContent = '🎯 СБРОС В ЦЕНТР / СТАРТ';
        startBtn.classList.remove('calibrating');
      }, 500);
    }

    function updateSensitivity(value) {
      sensitivity = Number(value);
      sensValue.textContent = `${value}x`;
    }

    function initializeUniversalControls() {
      updateModeUi('tilt');
      if (typeof DeviceOrientationEvent === 'undefined') {
        controlMode = 'swipe';
        updateModeUi('swipe');
        sensorInfo.textContent = '🟢 Управляйте пальцем — датчик наклона недоступен.';
        return;
      }
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        showControlStatus();
        return;
      }
      // Android/Chromium/Yandex do not need a permission dialog: listen at once.
      attachOrientationListeners();
      startOrientationProbe();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initializeUniversalControls();
      connectRelay();
    });
  </script>
</body>
</html>
