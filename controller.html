<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт Управления — Flexy Way</title>
  <!-- Paho MQTT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(20, 26, 45, 0.85);
      --card-border: rgba(99, 102, 241, 0.3);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #070913 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 0.65rem 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-badge.connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .room-bar {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 0.4rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.82rem;
      margin-top: 0.25rem;
    }

    .room-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      color: #38bdf8;
      font-weight: 800;
      font-size: 1.05rem;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      width: 90px;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .room-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Переключатель режимов Указка / Тачпад */
    .mode-switch-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 0.4rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.3rem;
      margin-top: 0.3rem;
    }

    .mode-switch-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 0.5rem;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-switch-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .sensor-info-bar {
      font-size: 0.72rem;
      color: #38bdf8;
      text-align: center;
      background: rgba(14, 165, 233, 0.1);
      border-radius: 8px;
      padding: 0.3rem 0.6rem;
      width: 100%;
      max-width: 440px;
      margin-top: 0.25rem;
    }

    .gyro-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin: 0.25rem 0;
    }

    .radar-card {
      width: 210px;
      height: 210px;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(15, 23, 42, 0.8) 70%);
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.25), inset 0 0 30px rgba(14, 165, 233, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
    }

    .radar-card.manual-mode {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.25), inset 0 0 30px rgba(16, 185, 129, 0.15);
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(15, 23, 42, 0.8) 70%);
    }

    .radar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.25);
      pointer-events: none;
    }
    .radar-ring.r1 { width: 68px; height: 68px; }
    .radar-ring.r2 { width: 136px; height: 136px; }
    
    .radar-crosshair-x {
      position: absolute;
      width: 100%;
      height: 1px;
      background: rgba(56, 189, 248, 0.2);
      pointer-events: none;
    }
    .radar-crosshair-y {
      position: absolute;
      height: 100%;
      width: 1px;
      background: rgba(56, 189, 248, 0.2);
      pointer-events: none;
    }

    .laser-reticle {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, rgba(56, 189, 248, 0.2) 70%);
      border: 2px solid #ffffff;
      box-shadow: 0 0 18px #38bdf8, 0 0 36px #0ea5e9;
      transform: translate(0px, 0px);
      pointer-events: none;
      transition: transform 0.04s ease-out;
    }

    .laser-reticle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .gyro-stats {
      display: flex;
      justify-content: space-around;
      width: 100%;
      gap: 0.4rem;
    }

    .stat-pill {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.45rem 0.25rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-pill span {
      display: block;
      font-weight: 800;
      font-size: 0.9rem;
      color: #38bdf8;
      margin-top: 0.15rem;
    }

    .start-btn {
      width: 100%;
      max-width: 440px;
      padding: 1.05rem 1rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .start-btn.calibrating {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4);
    }

    .controls-panel {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.65rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      margin-left: 0.8rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
    }

    .toggle-group {
      display: flex;
      gap: 0.4rem;
    }

    .toggle-btn {
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .hint-footer {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.2rem;
      line-height: 1.25;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>FLEXY REMOTE</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Поиск экрана...</span>
    </div>
  </header>

  <!-- Панель PIN комнаты -->
  <div class="room-bar">
    <span>PIN комнаты:</span>
    <input type="text" class="room-input" id="roomInput" maxlength="8" placeholder="PIN">
    <button class="room-btn" onclick="applyCustomRoom()">Подключить</button>
  </div>

  <!-- Переключатель режима управления -->
  <div class="mode-switch-container">
    <button class="mode-switch-btn active" id="modeGyroBtn" onclick="setControlMode('gyro')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="22" y1="12" x2="18" y2="12"></line>
        <line x1="6" y1="12" x2="2" y2="12"></line>
        <line x1="12" y1="6" x2="12" y2="2"></line>
        <line x1="12" y1="22" x2="12" y2="18"></line>
      </svg>
      🎯 Указка (Z-Поворот)
    </button>
    <button class="mode-switch-btn" id="modeManualBtn" onclick="setControlMode('manual')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="4"></rect>
        <circle cx="8" cy="12" r="2"></circle>
        <path d="M15 9h2v6h-2z"></path>
      </svg>
      🕹 Ручной тачпад
    </button>
  </div>

  <div class="sensor-info-bar" id="sensorInfo">
    🟢 Режим: Указка (Поворот Z влево/вправо + Наклон Y)
  </div>

  <!-- Интерактивный радар + Тачпад -->
  <div class="gyro-container">
    <div class="radar-card" id="radar">
      <div class="radar-crosshair-x"></div>
      <div class="radar-crosshair-y"></div>
      <div class="radar-ring r1"></div>
      <div class="radar-ring r2"></div>
      <div class="laser-reticle" id="laserReticle"></div>
    </div>

    <!-- Показания -->
    <div class="gyro-stats">
      <div class="stat-pill">
        Z-Поворот
        <span id="statX">0°</span>
      </div>
      <div class="stat-pill">
        Y-Наклон
        <span id="statY">0°</span>
      </div>
      <div class="stat-pill">
        Пакеты
        <span id="statPackets">0</span>
      </div>
    </div>
  </div>

  <!-- Главная кнопка старта / активации гироскопа -->
  <button class="start-btn" id="startBtn" onclick="activateAndCalibrate()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="22" y1="12" x2="18" y2="12"></line>
      <line x1="6" y1="12" x2="2" y2="12"></line>
      <line x1="12" y1="6" x2="12" y2="2"></line>
      <line x1="12" y1="22" x2="12" y2="18"></line>
    </svg>
    <span id="btnLabel">🎯 КАЛИБРОВАТЬ УКАЗКУ</span>
  </button>

  <!-- Тонкие настройки -->
  <div class="controls-panel">
    <div class="control-row">
      <span>Чувствительность</span>
      <div class="slider-container">
        <input type="range" id="sensSlider" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateSensitivity(this.value)">
        <span id="sensValue" style="color: #38bdf8; min-width: 32px;">1.5x</span>
      </div>
    </div>
    <div class="control-row">
      <span>Инверсия осей</span>
      <div class="toggle-group">
        <button class="toggle-btn" id="invXBtn" onclick="toggleInvert('x')">Инверт X</button>
        <button class="toggle-btn active" id="invYBtn" onclick="toggleInvert('y')">Инверт Y</button>
      </div>
    </div>
  </div>

  <div class="hint-footer" id="hintFooter">
    Поворачивайте телефон влево-вправо как лазерную указку (ось Z).<br>
    Наклоняйте вверх-вниз по вертикали (ось Y).
  </div>

  <script>
    // --- Room ID ---
    const urlParams = new URLSearchParams(window.location.search);
    const hashRoom = window.location.hash ? window.location.hash.replace('#room=', '').replace('#', '') : null;
    let roomId = (urlParams.get('room') || hashRoom || 'FLEXY').toUpperCase();

    const roomInput = document.getElementById('roomInput');
    roomInput.value = roomId;

    function applyCustomRoom() {
      const val = roomInput.value.trim().toUpperCase();
      if (val && val !== roomId) {
        roomId = val;
        window.history.replaceState({}, '', `?room=${roomId}`);
        initPahoMQTT();
      }
    }

    // --- DOM ---
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const btnLabel = document.getElementById('btnLabel');
    const laserReticle = document.getElementById('laserReticle');
    const radar = document.getElementById('radar');
    const statX = document.getElementById('statX');
    const statY = document.getElementById('statY');
    const statPackets = document.getElementById('statPackets');
    const sensSlider = document.getElementById('sensSlider');
    const sensValue = document.getElementById('sensValue');
    const invXBtn = document.getElementById('invXBtn');
    const invYBtn = document.getElementById('invYBtn');
    const sensorInfo = document.getElementById('sensorInfo');
    const hintFooter = document.getElementById('hintFooter');
    const modeGyroBtn = document.getElementById('modeGyroBtn');
    const modeManualBtn = document.getElementById('modeManualBtn');

    // --- State & Options ---
    let controlMode = 'gyro'; // 'gyro' | 'manual'
    let sensitivity = 1.5;
    let invertX = false;
    let invertY = true; // Инвертирован по дефолту

    // Z-axis Yaw (Alpha) & Y-axis Pitch (Beta)
    let baseAlpha = null;
    let baseBeta = null;
    let isCalibrated = false;
    let packetsSent = 0;

    let pahoClient = null;
    let isConnected = false;

    function vibratePhone(pattern = 35) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function setConnectedUI(connected) {
      isConnected = connected;
      if (connected) {
        statusBadge.classList.add('connected');
        statusText.textContent = 'Подключено ⚡';
      } else {
        statusBadge.classList.remove('connected');
        statusText.textContent = 'Поиск экрана...';
      }
    }

    // --- Mode Switcher ---
    function setControlMode(mode) {
      controlMode = mode;
      vibratePhone(30);

      if (mode === 'gyro') {
        modeGyroBtn.classList.add('active');
        modeManualBtn.classList.remove('active');
        radar.classList.remove('manual-mode');
        btnLabel.textContent = '🎯 КАЛИБРОВАТЬ УКАЗКУ';
        sensorInfo.textContent = '🟢 Режим: Указка (Поворот Z влево/вправо + Наклон Y)';
        hintFooter.innerHTML = 'Поворачивайте телефон влево-вправо как лазерную указку (ось Z).<br>Наклоняйте вверх-вниз по вертикали.';
        activateAndCalibrate();
      } else {
        modeManualBtn.classList.add('active');
        modeGyroBtn.classList.remove('active');
        radar.classList.add('manual-mode');
        btnLabel.textContent = '🕹 СБРОС В ЦЕНТР';
        sensorInfo.textContent = '🕹 Ручной режим: ведите пальцем по кругу радара';
        hintFooter.innerHTML = 'Ведите пальцем по экрану как по тачпаду.<br>Гироскоп отключен — руки не будут влиять.';
        updateRadarUI(0, 0, 0, 0);
        sendMotion(0, 0);
      }
    }

    // --- Paho MQTT WebSocket Connection ---
    function initPahoMQTT() {
      try {
        if (typeof Paho === 'undefined' || !Paho.MQTT) return;
        if (pahoClient && pahoClient.isConnected()) {
          try { pahoClient.disconnect(); } catch (e) {}
        }

        const clientId = 'c_' + Math.random().toString(36).substring(2, 10);
        pahoClient = new Paho.MQTT.Client('broker.hivemq.com', 8884, '/mqtt', clientId);

        pahoClient.onConnectionLost = (responseObject) => {
          setConnectedUI(false);
          setTimeout(initPahoMQTT, 2000);
        };

        pahoClient.onMessageArrived = (message) => {
          try {
            const data = JSON.parse(message.payloadString);
            if (data.type === 'haptic') {
              if (data.pattern === 'coin') vibratePhone([30, 40, 50]);
              else if (data.pattern === 'gameover') vibratePhone([100, 50, 150]);
            }
          } catch (e) {}
        };

        pahoClient.connect({
          useSSL: true,
          timeout: 4,
          onSuccess: () => {
            setConnectedUI(true);
            vibratePhone(40);
            pahoClient.subscribe(`flexy/events/${roomId}`);

            const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'controller_joined' }));
            msg.destinationName = `flexy/events/${roomId}`;
            pahoClient.send(msg);
          },
          onFailure: (err) => {
            setConnectedUI(false);
            setTimeout(initFallbackMQTT, 1000);
          }
        });
      } catch (e) {
        console.warn('Paho error:', e);
      }
    }

    function initFallbackMQTT() {
      try {
        const clientId = 'c_' + Math.random().toString(36).substring(2, 10);
        pahoClient = new Paho.MQTT.Client('broker.emqx.io', 8084, '/mqtt', clientId);
        pahoClient.connect({
          useSSL: true,
          timeout: 4,
          onSuccess: () => {
            setConnectedUI(true);
            pahoClient.subscribe(`flexy/events/${roomId}`);
            const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'controller_joined' }));
            msg.destinationName = `flexy/events/${roomId}`;
            pahoClient.send(msg);
          },
          onFailure: () => {
            setTimeout(initPahoMQTT, 2500);
          }
        });
      } catch (e) {}
    }

    // Send motion packet to PC screen
    let lastSendTime = 0;
    function sendMotion(normX, normY) {
      const now = performance.now();
      if (now - lastSendTime < 16) return; // 60 FPS
      lastSendTime = now;

      packetsSent++;
      statPackets.textContent = packetsSent;

      if (pahoClient && pahoClient.isConnected()) {
        const payload = JSON.stringify({
          type: 'motion',
          x: normX,
          y: normY
        });
        const msg = new Paho.MQTT.Message(payload);
        msg.destinationName = `flexy/motion/${roomId}`;
        pahoClient.send(msg);
      }
    }

    function updateRadarUI(normX, normY, dispX, dispY) {
      const radarRadius = 82;
      laserReticle.style.transform = `translate(${normX * radarRadius}px, ${-normY * radarRadius}px)`;

      statX.textContent = `${Math.round(dispX)}°`;
      statY.textContent = `${Math.round(dispY)}°`;
    }

    // Разница углов по модулю 360 градусов (устраняет скачки при переходе через 0°/360°)
    function angleDifference(target, base) {
      let diff = (target - base) % 360;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      return diff;
    }

    // --- ПОВОРОТ ПО ОСИ Z (Alpha / Указка) + НАКЛОН ПО ОСИ Y (Beta) ---
    function handleOrientation(e) {
      if (controlMode !== 'gyro') return;

      let alpha = e.alpha; // Поворот вокруг оси Z [0..360°]
      let beta = e.beta;   // Наклон вверх/вниз [-180..180°]

      if (alpha === null || beta === null) return;

      if (!isCalibrated || baseAlpha === null || baseBeta === null) {
        baseAlpha = alpha;
        baseBeta = beta;
        isCalibrated = true;
      }

      // 1. Горизонталь (X) = Поворот телефона вокруг Z как указки:
      // При повороте телефона вправо alpha уменьшается -> -angleDifference дает положительное значение
      let deltaZ = -angleDifference(alpha, baseAlpha);

      // 2. Вертикаль (Y) = Наклон телефона вверх/вниз:
      let deltaY = (baseBeta - beta);

      const MAX_Z_ANGLE = 22.0; // 22 градуса поворота на полный ход
      const MAX_Y_ANGLE = 22.0; // 22 градуса наклона на полный ход

      let normX = (deltaZ / MAX_Z_ANGLE) * sensitivity;
      let normY = (deltaY / MAX_Y_ANGLE) * sensitivity;

      if (invertX) normX = -normX;
      if (invertY) normY = -normY;

      normX = Math.max(-1.0, Math.min(1.0, normX));
      normY = Math.max(-1.0, Math.min(1.0, normY));

      updateRadarUI(normX, normY, deltaZ, deltaY);
      sendMotion(normX, normY);
    }

    // --- Ручной сенсорный тачпад (Manual Mode) ---
    function handleTouchRadar(clientX, clientY) {
      const rect = radar.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const maxR = rect.width / 2;

      let dx = (clientX - centerX) / maxR;
      let dy = -(clientY - centerY) / maxR;

      dx = Math.max(-1.0, Math.min(1.0, dx * sensitivity));
      dy = Math.max(-1.0, Math.min(1.0, dy * sensitivity));

      if (invertX) dx = -dx;
      if (invertY) dy = -dy;

      updateRadarUI(dx, dy, dx * 100, dy * 100);
      sendMotion(dx, dy);
    }

    radar.addEventListener('pointerdown', (e) => {
      handleTouchRadar(e.clientX, e.clientY);
    });

    radar.addEventListener('pointermove', (e) => {
      if (e.buttons > 0 || e.pointerType === 'touch') {
        handleTouchRadar(e.clientX, e.clientY);
      }
    });

    // --- Калибровка центра ---
    async function activateAndCalibrate() {
      vibratePhone(40);

      if (controlMode === 'manual') {
        updateRadarUI(0, 0, 0, 0);
        sendMotion(0, 0);
        startBtn.classList.add('calibrating');
        btnLabel.textContent = '🕹 ЦЕНТР СБРОШЕН';
        setTimeout(() => {
          btnLabel.textContent = '🕹 СБРОС В ЦЕНТР';
          startBtn.classList.remove('calibrating');
        }, 500);
        return;
      }

      isCalibrated = false;
      baseAlpha = null;
      baseBeta = null;

      startBtn.classList.add('calibrating');
      btnLabel.textContent = '🎯 УКАЗКА НАЦЕЛЕНА!';
      setTimeout(() => {
        btnLabel.textContent = '🎯 КАЛИБРОВАТЬ УКАЗКУ';
        startBtn.classList.remove('calibrating');
      }, 600);

      // Запрос Screen WakeLock
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch (err) {}
      }

      // iOS permission
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === 'granted') {
            attachSensorListener();
          }
        } catch (e) {}
      } else {
        attachSensorListener();
      }

      if (pahoClient && pahoClient.isConnected()) {
        const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'recalibrate' }));
        msg.destinationName = `flexy/events/${roomId}`;
        pahoClient.send(msg);
      }
    }

    let isListenerAttached = false;
    function attachSensorListener() {
      if (!isListenerAttached) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        isListenerAttached = true;
      }
    }

    function updateSensitivity(val) {
      sensitivity = parseFloat(val);
      sensValue.textContent = `${val}x`;
    }

    function toggleInvert(axis) {
      if (axis === 'x') {
        invertX = !invertX;
        invXBtn.classList.toggle('active', invertX);
      } else if (axis === 'y') {
        invertY = !invertY;
        invYBtn.classList.toggle('active', invertY);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPahoMQTT();
      attachSensorListener();
    });
  </script>
</body>
</html>
