<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пульт Управления — Flexy Way</title>
  <!-- MQTT for ultra-fast zero-NAT global cloud signaling -->
  <script src="https://unpkg.com/mqtt@5.5.2/dist/mqtt.min.js"></script>
  <!-- PeerJS for WebRTC P2P -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(20, 26, 45, 0.85);
      --card-border: rgba(99, 102, 241, 0.3);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #070913 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1rem;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Шапка */
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 0.75rem 1.1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-badge.connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Ввод PIN комнаты при ручном открытии */
    .room-bar {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .room-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      color: #38bdf8;
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
      padding: 0.3rem 0.6rem;
      width: 100px;
      text-align: center;
      letter-spacing: 0.1em;
    }

    .room-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* Радар / 3D Гироскоп */
    .gyro-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin: 0.6rem 0;
    }

    .radar-card {
      width: 220px;
      height: 220px;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(15, 23, 42, 0.7) 70%);
      border: 2px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.2), inset 0 0 30px rgba(14, 165, 233, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .radar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.25);
    }
    .radar-ring.r1 { width: 70px; height: 70px; }
    .radar-ring.r2 { width: 140px; height: 140px; }
    
    .radar-crosshair-x {
      position: absolute;
      width: 100%;
      height: 1px;
      background: rgba(56, 189, 248, 0.2);
    }
    .radar-crosshair-y {
      position: absolute;
      height: 100%;
      width: 1px;
      background: rgba(56, 189, 248, 0.2);
    }

    .laser-reticle {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, rgba(56, 189, 248, 0.2) 70%);
      border: 2px solid #ffffff;
      box-shadow: 0 0 18px #38bdf8, 0 0 36px #0ea5e9;
      transform: translate(0px, 0px);
      transition: transform 0.03s linear;
      pointer-events: none;
    }

    .laser-reticle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .gyro-stats {
      display: flex;
      justify-content: space-around;
      width: 100%;
      gap: 0.5rem;
    }

    .stat-pill {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.5rem 0.3rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-pill span {
      display: block;
      font-weight: 800;
      font-size: 0.95rem;
      color: #38bdf8;
      margin-top: 0.2rem;
    }

    /* Главная кнопка старта */
    .start-btn {
      width: 100%;
      max-width: 440px;
      padding: 1.15rem 1rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .start-btn.calibrating {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4);
    }

    /* Панель настроек */
    .controls-panel {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      margin-left: 0.8rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
    }

    .toggle-group {
      display: flex;
      gap: 0.4rem;
    }

    .toggle-btn {
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .hint-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.4rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>FLEXY AIR REMOTE</span>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">Поиск экрана...</span>
    </div>
  </header>

  <!-- Панель кода комнаты -->
  <div class="room-bar">
    <span>Код комнаты:</span>
    <input type="text" class="room-input" id="roomInput" maxlength="8" placeholder="PIN">
    <button class="room-btn" onclick="applyCustomRoom()">Сменить</button>
  </div>

  <!-- Интерактивный радар -->
  <div class="gyro-container">
    <div class="radar-card" id="radar">
      <div class="radar-crosshair-x"></div>
      <div class="radar-crosshair-y"></div>
      <div class="radar-ring r1"></div>
      <div class="radar-ring r2"></div>
      <div class="laser-reticle" id="laserReticle"></div>
    </div>

    <!-- Показания датчиков -->
    <div class="gyro-stats">
      <div class="stat-pill">
        X (Поворот)
        <span id="statX">0°</span>
      </div>
      <div class="stat-pill">
        Y (Наклон)
        <span id="statY">0°</span>
      </div>
      <div class="stat-pill">
        Канал
        <span id="statPing">MQTT ⚡</span>
      </div>
    </div>
  </div>

  <!-- Главная кнопка старта / калибровки -->
  <button class="start-btn" id="startBtn" onclick="activateAndCalibrate()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="22" y1="12" x2="18" y2="12"></line>
      <line x1="6" y1="12" x2="2" y2="12"></line>
      <line x1="12" y1="6" x2="12" y2="2"></line>
      <line x1="12" y1="22" x2="12" y2="18"></line>
    </svg>
    <span id="btnLabel">🚀 СТАРТ / КАЛИБРОВКА</span>
  </button>

  <!-- Тонкие настройки -->
  <div class="controls-panel">
    <div class="control-row">
      <span>Чувствительность</span>
      <div class="slider-container">
        <input type="range" id="sensSlider" min="0.5" max="3.0" step="0.1" value="1.4" oninput="updateSensitivity(this.value)">
        <span id="sensValue" style="color: #38bdf8; min-width: 32px;">1.4x</span>
      </div>
    </div>
    <div class="control-row">
      <span>Инверсия осей</span>
      <div class="toggle-group">
        <button class="toggle-btn" id="invXBtn" onclick="toggleInvert('x')">Инверт X</button>
        <button class="toggle-btn" id="invYBtn" onclick="toggleInvert('y')">Инверт Y</button>
      </div>
    </div>
  </div>

  <div class="hint-footer">
    Направьте телефон на экран как указку.<br>
    Нажимайте кнопку для центрирования.
  </div>

  <script>
    // --- Извлечение Room ID ---
    const urlParams = new URLSearchParams(window.location.search);
    const hashRoom = window.location.hash ? window.location.hash.replace('#room=', '').replace('#', '') : null;
    let roomId = (urlParams.get('room') || hashRoom || 'flexy1').toUpperCase();

    const roomInput = document.getElementById('roomInput');
    roomInput.value = roomId;

    function applyCustomRoom() {
      const val = roomInput.value.trim().toUpperCase();
      if (val && val !== roomId) {
        roomId = val;
        window.history.replaceState({}, '', `?room=${roomId}`);
        connectChannels();
      }
    }

    // --- DOM Элементы ---
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const btnLabel = document.getElementById('btnLabel');
    const laserReticle = document.getElementById('laserReticle');
    const statX = document.getElementById('statX');
    const statY = document.getElementById('statY');
    const statPing = document.getElementById('statPing');
    const sensSlider = document.getElementById('sensSlider');
    const sensValue = document.getElementById('sensValue');
    const invXBtn = document.getElementById('invXBtn');
    const invYBtn = document.getElementById('invYBtn');

    let sensitivity = 1.4;
    let invertX = false;
    let invertY = false;

    let baseAlpha = null;
    let baseBeta = null;
    let baseGamma = null;
    let isCalibrated = false;
    let sensorsActive = false;

    let mqttClient = null;
    let peer = null;
    let peerConn = null;
    let isConnected = false;

    function vibratePhone(pattern = 35) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function setConnectedUI(connected) {
      isConnected = connected;
      if (connected) {
        statusBadge.classList.add('connected');
        statusText.textContent = 'Подключено ⚡';
        vibratePhone(50);
      } else {
        statusBadge.classList.remove('connected');
        statusText.textContent = 'Поиск экрана...';
      }
    }

    // --- 1. Высокоскоростной MQTT WSS канал (100% пробивает любые мобильные сети) ---
    function initMQTT() {
      try {
        if (typeof mqtt === 'undefined') return;
        if (mqttClient) {
          try { mqttClient.end(); } catch (e) {}
        }

        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        const clientId = 'ctrl_' + Math.random().toString(16).substring(2, 10);

        mqttClient = mqtt.connect(brokerUrl, {
          clientId,
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 2500
        });

        mqttClient.on('connect', () => {
          setConnectedUI(true);
          statPing.textContent = 'MQTT ⚡';
          mqttClient.subscribe(`flexy/events/${roomId}`);
          mqttClient.publish(`flexy/events/${roomId}`, JSON.stringify({ type: 'controller_joined' }));
        });

        mqttClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (data.type === 'haptic') {
              if (data.pattern === 'coin') vibratePhone([30, 40, 50]);
              else if (data.pattern === 'gameover') vibratePhone([100, 50, 150]);
            }
          } catch (e) {}
        });

        mqttClient.on('close', () => {
          if (!peerConn || !peerConn.open) setConnectedUI(false);
        });
      } catch (e) {
        console.warn('MQTT error:', e);
      }
    }

    // --- 2. PeerJS WebRTC P2P резерв ---
    function initPeerJS() {
      if (typeof Peer === 'undefined') return;
      try {
        if (peer) {
          try { peer.destroy(); } catch (e) {}
        }

        peer = new Peer({
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', () => {
          const hostPeerId = `flexy-host-${roomId}`;
          peerConn = peer.connect(hostPeerId, { reliable: false });

          peerConn.on('open', () => {
            setConnectedUI(true);
            statPing.textContent = 'P2P ⚡';
          });

          peerConn.on('data', (data) => {
            if (data.type === 'haptic') {
              if (data.pattern === 'coin') vibratePhone([30, 40, 50]);
              else if (data.pattern === 'gameover') vibratePhone([100, 50, 150]);
            }
          });
        });
      } catch (err) {}
    }

    function connectChannels() {
      initMQTT();
      initPeerJS();
    }

    // --- Отправка координат ---
    let lastSendTime = 0;
    function sendMotion(normX, normY, rawAlpha, rawBeta) {
      const now = performance.now();
      if (now - lastSendTime < 16) return; // ~60 FPS
      lastSendTime = now;

      const payload = {
        type: 'motion',
        x: normX,
        y: normY,
        rawAlpha,
        rawBeta
      };

      // Передаем через MQTT
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`flexy/motion/${roomId}`, JSON.stringify(payload));
      }

      // Дублируем через WebRTC P2P если открыт
      if (peerConn && peerConn.open) {
        peerConn.send(payload);
      }
    }

    function angleDelta(target, base) {
      let diff = target - base;
      while (diff < -180) diff += 360;
      while (diff > 180) diff -= 360;
      return diff;
    }

    function handleOrientation(e) {
      let alpha = e.alpha;
      let beta = e.beta;
      let gamma = e.gamma;

      if (alpha === null || beta === null) return;

      if (!isCalibrated || baseAlpha === null) {
        baseAlpha = alpha;
        baseBeta = beta;
        baseGamma = gamma;
        isCalibrated = true;
      }

      let deltaYaw = angleDelta(alpha, baseAlpha);
      let deltaPitch = beta - baseBeta;

      const MAX_DEFLECTION_ANGLE = 25;

      let normX = (-deltaYaw / MAX_DEFLECTION_ANGLE) * sensitivity;
      let normY = (deltaPitch / MAX_DEFLECTION_ANGLE) * sensitivity;

      if (invertX) normX = -normX;
      if (invertY) normY = -normY;

      normX = Math.max(-1.0, Math.min(1.0, normX));
      normY = Math.max(-1.0, Math.min(1.0, normY));

      const radarRadius = 85;
      laserReticle.style.transform = `translate(${normX * radarRadius}px, ${-normY * radarRadius}px)`;

      statX.textContent = `${Math.round(deltaYaw)}°`;
      statY.textContent = `${Math.round(deltaPitch)}°`;

      sendMotion(normX, normY, alpha, beta);
    }

    async function activateAndCalibrate() {
      vibratePhone(50);
      isCalibrated = false;
      baseAlpha = null;
      baseBeta = null;
      baseGamma = null;

      startBtn.classList.add('calibrating');
      btnLabel.textContent = '🎯 ЦЕНТР ЗАДАН!';
      setTimeout(() => {
        btnLabel.textContent = '🎯 КАЛИБРОВАТЬ ЦЕНТР';
      }, 800);

      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch (err) {}
      }

      if (!sensorsActive) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const state = await DeviceOrientationEvent.requestPermission();
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
              sensorsActive = true;
            }
          } catch (e) {}
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
          sensorsActive = true;
        }
      }

      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`flexy/events/${roomId}`, JSON.stringify({ type: 'recalibrate' }));
      }
      if (peerConn && peerConn.open) {
        peerConn.send({ type: 'recalibrate' });
      }
    }

    function updateSensitivity(val) {
      sensitivity = parseFloat(val);
      sensValue.textContent = `${val}x`;
    }

    function toggleInvert(axis) {
      if (axis === 'x') {
        invertX = !invertX;
        invXBtn.classList.toggle('active', invertX);
      } else if (axis === 'y') {
        invertY = !invertY;
        invYBtn.classList.toggle('active', invertY);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      connectChannels();

      if (typeof DeviceOrientationEvent === 'undefined' || typeof DeviceOrientationEvent.requestPermission !== 'function') {
        window.addEventListener('deviceorientation', handleOrientation, true);
        sensorsActive = true;
      }
    });
  </script>
</body>
</html>
